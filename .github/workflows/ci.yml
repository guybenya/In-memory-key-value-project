# CI: builds the server and runs every check on Linux and macOS for each push and pull request.
name: CI

# Pushes to feature branches are tested through their pull request, so 'push' only needs main.
# (Triggering on every push AND every PR ran each commit twice.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      # Don't cancel the other OS when one fails - we want to see both results.
      fail-fast: false
      matrix:
        # Ubuntu is pinned so the environment only changes when we choose to
        # (ubuntu-latest moves to Ubuntu 26 starting October 2026).
        os: [ubuntu-24.04, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Show compiler version
        run: clang --version

      # -Werror turns every compiler warning into an error, so warnings can't reach main.
      - name: Build the server
        run: make all EXTRA_CFLAGS=-Werror

      # Unit tests + AddressSanitizer/UBSan (+ the 'leaks' tool on macOS).
      - name: Run tests and sanitizers
        run: make check EXTRA_CFLAGS=-Werror

      # Starts the real server and talks to it over TCP (Python is preinstalled on both runners).
      - name: Run integration test
        run: make integration EXTRA_CFLAGS=-Werror

      # The same test against a server built with AddressSanitizer + UBSan.
      - name: Run integration test with sanitizers
        run: make integration-asan EXTRA_CFLAGS=-Werror

      # Confirms the tests still catch a deliberately planted bug.
      - name: Run mutation test
        run: make mutation
